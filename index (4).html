<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอร์บ้านเซอร์วิส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3A86BD;--blue-d:#245F87;--blue-soft:#EAF3FA;--blue-line:#D6E6F2;
  --pink:#E2608C;--pink-soft:#FCEBF1;
  --ink:#141C25;--muted:#5B6674;--line:#E3EAF0;--bg:#F5F8FB;--card:#FFFFFF;--field:#FFFFFF;
  --green:#4FA43A;--orange:#EDB04F;--grey:#9AA1A9;--red:#D65454;
  --shadow:0 6px 20px rgba(52,119,159,.10);
  --r-lg:26px;--r-md:16px;--r-sm:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6AAEDC;--blue-d:#8CC2E8;--blue-soft:#1C2E3C;--blue-line:#2A4254;
  --pink:#F07FA5;--pink-soft:#3A2230;
  --ink:#F2F6FA;--muted:#B3BFCB;--line:#2A3642;--bg:#111920;--card:#18222C;--field:#1D2833;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --blue:#6AAEDC;--blue-d:#8CC2E8;--blue-soft:#1C2E3C;--blue-line:#2A4254;
  --pink:#F07FA5;--pink-soft:#3A2230;
  --ink:#F2F6FA;--muted:#B3BFCB;--line:#2A3642;--bg:#111920;--card:#18222C;--field:#1D2833;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Anuphan","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{flex:none;display:block}
.num,.big,.money{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
main{min-width:0;padding-bottom:120px}
.wrap{padding:0 18px;max-width:1080px;margin:0 auto}
.wrap.narrow{max-width:760px}
@media (min-width:900px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;align-self:start;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:22px 14px}
  .bnav{display:none!important}
  main{padding-bottom:48px}
  .wrap{padding:0 32px}
}
.side .brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.side .brand b{font-size:15px;line-height:1.25}
.side .brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.side .grp{font-size:12px;color:var(--muted);padding:14px 12px 4px}
.side button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:12px;color:var(--ink);font-size:15px;text-align:left}
.side button:hover{background:var(--blue-soft)}
.side button.on{background:var(--blue-soft);color:var(--blue-d);font-weight:600}
.side button .ic{color:var(--blue)}

/* bottom nav, floating pill like the reference */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 28px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:40px;box-shadow:0 10px 30px rgba(30,60,90,.16);display:grid;grid-template-columns:repeat(4,1fr);padding:7px;z-index:30}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:30px;font-size:13px;font-weight:600;color:var(--ink)}
.bnav button.on{background:var(--blue-soft)}
.bnav button.on .ic{color:var(--blue-d)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (min-width:900px){.top{padding:16px 32px}}
.rbtn{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--blue)}
.rbtn.ghost{box-shadow:none;background:none}
.rbtn.light{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.ttl{justify-self:center;display:flex;align-items:center;gap:4px;font-size:20px;font-weight:600;color:var(--blue);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ttl:disabled{cursor:default;color:var(--blue)}
.ttl span{overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;gap:2px;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:3px 6px;min-height:46px;align-items:center}
.pill:empty{background:none;box-shadow:none;min-width:46px}
.ib{width:42px;height:40px;display:grid;place-items:center;color:var(--blue);border-radius:20px}
.ib:hover{background:var(--blue-soft)}

/* ---------- hero (home) ---------- */
.hero{background:var(--blue);color:#fff;padding:18px 0 78px;border-radius:0 0 50% 50% / 0 0 34px 34px}
.hero-in{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1080px;margin:0 auto;padding:0 18px}
@media (min-width:900px){.hero-in{padding:0 32px}}
.comp{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:62px;height:62px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.logo.sm{width:40px;height:40px}
.cname{font-size:22px;font-weight:700;line-height:1.2}
.cmail{font-size:15px;opacity:.9}
.hero .cname{color:#fff}
.comp.dark .cname{color:var(--blue)}
.comp.dark .cmail{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-58px}
.tile{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--muted)}
.tile-ic{width:70px;height:70px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.tile:hover .tile-ic{background:var(--blue-line)}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,200px))}}

/* ---------- generic ---------- */
.h2{font-size:22px;font-weight:700;margin:28px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 18px;border-radius:30px;border:1.5px solid var(--line);font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;background:var(--card)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.chip.sq{border-radius:12px;border:0;background:var(--line);color:var(--muted)}
.chip.sq.on{background:var(--blue);color:#fff}
.grid2{display:grid;gap:16px;margin-top:14px}
@media (min-width:760px){.grid2{grid-template-columns:1.3fr 1fr;align-items:start}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.card.pad{padding:20px 22px}
.card-hd{padding:20px 22px 14px;background:color-mix(in srgb,var(--bg) 60%,var(--card));border-bottom:1.5px solid var(--line)}
.card-bd{padding:18px 22px 6px}
.lbl{font-size:18px;color:var(--muted);font-weight:500}
.big{font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1.15;color:var(--blue)}
.big.neg{color:var(--pink)}
.bar{height:11px;border-radius:10px;background:var(--pink);overflow:hidden}
.bar.empty{background:var(--line)}
.bar span{display:block;height:100%;background:var(--blue);border-radius:10px}
.bar.grey{background:var(--line)}
.split{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.split .r{text-align:right}
.split.mt{margin-top:14px}
.dot{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--ink)}
.split .r .dot{justify-content:flex-end}
.dot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--grey)}
.dot.blue::before{background:var(--blue)}.dot.pink::before{background:var(--pink)}
.num{font-size:22px;font-weight:700}
.num.lg{font-size:30px}
.blue{color:var(--blue)}.pink{color:var(--pink)}.muted{color:var(--muted)}
.sub{font-size:15px;color:var(--muted)}
.more{display:block;width:100%;border-top:1.5px solid var(--line);margin-top:14px;padding:14px 0 12px;color:var(--blue);font-weight:600;font-size:17px;text-align:center}
.more::after{content:"  ›"}
.note{margin-top:14px;padding:10px 12px;background:var(--blue-soft);border-radius:12px;font-size:14px}
.lnk{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ic{margin:0 auto 14px;color:var(--blue)}
.empty b{display:block;color:var(--muted);font-size:18px;font-weight:600}
.empty .cta{color:var(--blue);font-weight:600;font-size:17px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:16px}
.btn.ghost{background:var(--blue-soft);color:var(--blue-d)}
.btn.pinkb{background:var(--pink)}
.btn.danger{background:none;color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.btn.block{display:flex;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}

/* account card (blue / pink / plain) */
.acc{border-radius:var(--r-lg);overflow:hidden;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.acc-top{padding:18px 22px 22px;color:#fff;background:var(--blue)}
.acc.pink .acc-top{background:var(--pink)}
.acc.plain .acc-top{background:color-mix(in srgb,var(--bg) 60%,var(--card));color:var(--ink);border-bottom:1.5px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid rgba(255,255,255,.35);border-radius:30px;padding:3px}
.acc.plain .seg{border-color:var(--line)}
.seg button{padding:8px 4px;border-radius:26px;font-weight:600;font-size:15px;color:inherit;white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.25)}
.acc.plain .seg button.on{background:var(--line)}
.per{display:inline-flex;align-items:center;gap:4px;margin-top:14px;font-size:16px;font-weight:500;color:inherit}
.acc .big{color:#fff;margin-top:2px}
.acc.plain .big{color:var(--blue)}
.acc.plain .big.neg{color:var(--pink)}
.acc-bd{padding:18px 22px 4px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;margin-top:6px}
@media (min-width:760px){.menu{grid-template-columns:repeat(8,1fr)}}
.mi{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--muted);text-align:center;line-height:1.25}
.mi span.c{width:62px;height:62px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.mi:hover span.c{background:var(--blue-line)}
.sechd{display:flex;justify-content:space-between;align-items:baseline}
.sechd .lnk{text-decoration:none}

/* lists */
.search{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);margin:4px 0 10px;font-size:16px}
.list{border-top:1px solid var(--blue-line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;padding:16px 4px;border-bottom:1px solid var(--blue-line)}
.row:hover{background:color-mix(in srgb,var(--blue-soft) 50%,transparent)}
.row .t{font-size:18px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:15px;color:var(--muted);font-weight:500}
.row .a{font-size:19px;font-weight:700;color:var(--blue);text-align:right;white-space:nowrap}
.row .a.pink{color:var(--pink)}
.row .s{grid-column:1/-1}
.row.av{grid-template-columns:auto 1fr auto}
.av-sq{width:56px;height:56px;border-radius:10px;background:color-mix(in srgb,var(--line) 70%,var(--card));border:1px solid var(--line);display:grid;place-items:center;font-size:24px;color:var(--muted);grid-row:span 2}
.badge{display:inline-block;padding:1px 10px;border-radius:5px;font-size:13px;font-weight:600;color:#fff;background:var(--grey);white-space:nowrap}
.badge.green{background:var(--green)}.badge.orange{background:var(--orange)}.badge.blue{background:var(--blue-d)}.badge.red{background:var(--red)}
.tag{display:inline-block;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);margin-right:4px}
.fab{position:fixed;right:22px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(52,119,159,.35);z-index:25}
@media (min-width:900px){.fab{bottom:32px;right:32px}}

/* chart */
.chartbox{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 12px 8px;margin-top:16px}
.chart-nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:6px}
.chart-nav h3{margin:0;text-align:center;font-size:20px}
.chart-nav button{width:44px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.chart-scroll{overflow-x:auto}
.chart-scroll svg{display:block;min-width:100%}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.statc{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.statc b{display:block;font-size:26px}
.diff{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:12px;font-size:17px}
.diff b{font-size:24px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:0 -18px}
.tabs button{padding:10px 4px 12px;font-size:17px;font-weight:600;color:var(--muted);border-bottom:4px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.tabs button.on.pk{color:var(--pink);border-color:var(--pink)}
.tabs button.on.gr{color:var(--ink);border-color:var(--muted)}
@media (min-width:900px){.tabs{margin:0}}

/* document editor */
.dhead{text-align:right;padding:4px 0 14px;border-bottom:1.5px solid var(--blue-line)}
.dhead h1{font-size:28px;color:var(--blue);margin:0;font-weight:600;line-height:1.25}
.dno{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:6px 0 8px;font-size:19px;color:var(--blue);font-weight:600}
.dmeta{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 14px}
.dmeta label{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:15px}
.dmeta input,.dmeta select{border:1.5px solid var(--blue-line);border-radius:10px;padding:5px 8px;background:var(--field);color:var(--blue-d)}
.fld{display:flex;align-items:center;gap:10px;padding:14px 4px;border-bottom:1.5px solid var(--blue-line);color:var(--blue)}
.fld input,.fld select{flex:1;border:0;background:none;font-size:18px;color:var(--blue-d);padding:4px 0;min-width:0}
.fld input::placeholder{color:var(--muted)}
.line{padding:14px 4px;border-bottom:1.5px solid var(--blue-line)}
.line-top{display:flex;gap:8px;align-items:center}
.line input{border:1.5px solid transparent;border-radius:8px;background:none;padding:4px 6px;min-width:0}
.line input:hover,.line input:focus{border-color:var(--blue-line);background:var(--field)}
.lname{flex:1;font-size:18px;font-weight:600;color:var(--blue-d)}
.ldesc{width:100%;font-size:14px;color:var(--muted)}
.line-nums{display:grid;grid-template-columns:1fr 1fr 1.4fr 1.4fr;gap:8px;align-items:end;margin-top:4px}
.line-nums label{font-size:12px;color:var(--muted);display:flex;flex-direction:column}
.line-nums input{font-size:16px;width:100%}
.lsum{text-align:right;font-weight:700;font-size:18px;color:var(--blue);padding-bottom:5px}
.xs{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.xs:hover{background:var(--pink-soft);color:var(--pink)}
.addline{display:flex;align-items:center;gap:10px;padding:18px 4px;color:var(--blue);font-size:19px;font-weight:600}
.addline .ic{background:var(--blue);color:#fff;border-radius:50%;padding:3px}
.tot-in{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px 18px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 70%,var(--card));border-top:1.5px solid var(--blue-line)}
.tot-in label{display:flex;align-items:center;gap:8px;font-size:16px}
.tot-in input,.tot-in select{width:90px;border:1.5px solid var(--blue);border-radius:6px;padding:4px 8px;background:var(--field);text-align:right;color:var(--blue-d)}
.tot{background:color-mix(in srgb,var(--bg) 70%,var(--card));padding:4px 16px 14px}
.tr{display:grid;grid-template-columns:1fr 150px;gap:16px;padding:5px 0;font-size:18px;text-align:right}
.tr span:first-child{color:var(--ink)}
.tr.hl span:last-child{color:var(--blue);font-weight:700;font-size:22px}
.tr.faint{color:var(--muted)}
.tr.sep{border-top:1.5px solid var(--blue-line);margin-top:6px;padding-top:10px}
.more-f{padding:4px 0}
.more-f label{display:block;color:var(--blue);font-size:17px;font-weight:600;margin:16px 0 6px}
.more-f textarea,.form input,.form select,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--field);font-size:16px}
.more-f textarea{min-height:70px}
.actions{display:grid;gap:10px;margin:22px 0 10px}
@media (min-width:600px){.actions{grid-template-columns:repeat(2,1fr)}}

/* forms */
.form{display:grid;gap:14px;margin-top:6px}
.form label{display:grid;gap:6px;font-size:15px;color:var(--muted);font-weight:500}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .chk{display:flex;align-items:center;gap:10px;color:var(--ink)}
.form .chk input{width:22px;height:22px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;background:var(--field)}
.seg2 button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-d)}

/* sheet & modal */
.ovl{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(640px,100%);border-radius:30px 30px 0 0;padding:10px 24px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@media (min-width:700px){.ovl{align-items:center}.sheet{border-radius:26px;margin:20px}}
.sheet .grab{width:60px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 10px;font-size:22px}
.sheet .sg{font-size:14px;color:var(--muted);margin:14px 0 2px}
.sitem{display:flex;align-items:center;gap:16px;width:100%;padding:12px 0;font-size:19px;text-align:left}
.sitem .ic{color:var(--blue)}

async function put(col,rec){
  rec=clone(rec);const i=S[col].findIndex(x=>x.id===rec.id);
  if(i>=0)S[col][i]=rec;else S[col].push(rec);
  if(DB){const {id,...body}=rec;const {error}=await DB.from('records').upsert({org_id:ORG,col,id,data:body},{onConflict:'org_id,col,id'});
    if(error){console.warn(error);toast(error.code==='42501'?'ไม่มีสิทธิ์บันทึกรายการนี้':'บันทึกไม่สำเร็จ ลองอีกครั้ง');sbReloadAll()}}
  else saveLocal();
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(DB){const {error}=await DB.from('records').delete().eq('org_id',ORG).eq('col',col).eq('id',id);if(error){console.warn(error);toast('ลบไม่สำเร็จ ลองอีกครั้ง');sbReloadAll()}}else saveLocal();
}

/* ================= calculations ================= */
function calc(d){
  const sub=r2((d.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0));
  const disc=(+d.discAmt>0)?r2(Math.min(+d.discAmt,sub)):r2(sub*(+d.discPct||0)/100),after=r2(sub-disc);
  let pre,vat,total;
  if(d.vatMode==='inc'){total=after;vat=r2(after*7/107);pre=r2(total-vat)}
  else if(d.vatMode==='exc'){pre=after;vat=r2(after*.07);total=r2(pre+vat)}
  else{pre=after;vat=0;total=after}
  const wht=r2(pre*(+d.whtPct||0)/100);
  return{sub,disc,after,pre,vat,total,wht,pay:r2(total-wht)};
}
function ecalc(e){const total=+e.amount||0,vat=e.hasVat?r2(total*7/107):0,pre=r2(total-vat),wht=r2(pre*(+e.whtPct||0)/100);return{total,vat,pre,wht,pay:r2(total-wht)}}
function nextNo(prefix,date,nos){const base=prefix+date.slice(0,4)+date.slice(5,7);let max=0;nos.forEach(n=>{if(n&&n.startsWith(base)){const k=parseInt(n.slice(base.length),10)||0;if(k>max)max=k}});return base+String(max+1).padStart(4,'0')}
const reNos=()=>S.docs.map(d=>d.payment&&d.payment.receiptNo).filter(Boolean);
function range(key,ref=new Date()){const y=ref.getFullYear(),m=ref.getMonth();
  if(key==='month')return[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
  if(key==='quarter'){const q=Math.floor(m/3)*3;return[ymd(new Date(y,q,1)),ymd(new Date(y,q+3,0))]}
  return[y+'-01-01',y+'-12-31']}
const inR=(d,rg)=>d>=rg[0]&&d<=rg[1];
function metrics(rg){
  let income=0,collected=0,cost=0,paid=0;
  S.docs.forEach(d=>{if(d.status==='ยกเลิก'||!inR(d.date,rg))return;const T=DT[d.type];if(!T)return;
    if(T.income){if(T.sign){if(d.status==='อนุมัติแล้ว'){const t=T.sign*calc(d).total;income+=t;collected+=t}}else{if(!d.noIncome){const t=calc(d).total;income+=t;if(d.status==='เก็บเงินแล้ว')collected+=t}}}
    if(T.cost){const t=calc(d).total;cost+=t;if(d.status==='ชำระแล้ว')paid+=t}});
  S.expenses.forEach(e=>{if(e.status==='ยกเลิก'||!inR(e.date,rg))return;const t=ecalc(e).total;cost+=t;if(e.status==='ชำระแล้ว')paid+=t});
  return{income:r2(income),collected:r2(collected),recv:r2(income-collected),cost:r2(cost),paid:r2(paid),payable:r2(cost-paid),net:r2(income-cost)};
}
function balances(){const c=company();let cash=+c.openCash||0,bank=+c.openBank||0;
  S.docs.forEach(d=>{if(d.status==='ยกเลิก'||!d.payment||!DT[d.type])return;const a=+d.payment.amount||0,sg=DT[d.type].group==='buy'?-1:1;if(d.payment.method==='cash')cash+=sg*a;else bank+=sg*a});
  S.expenses.forEach(e=>{if(e.status!=='ชำระแล้ว')return;const a=ecalc(e).pay;if(e.method==='cash')cash-=a;else bank-=a});
  return{cash:r2(cash),bank:r2(bank)}}
function stockOf(pid){const p=byId('products',pid);let q=+(p&&p.openingStock)||0;
  S.docs.forEach(d=>{if(d.status==='ยกเลิก')return;const sg=d.type==='RI'?1:(d.type==='INV'||d.type==='CS')?-1:0;if(!sg)return;(d.items||[]).forEach(i=>{if(i.pid===pid)q+=sg*(+i.qty||0)})});return q}

let stack=[{p:'home'}];

function go(p,a={},replace){const r={p,...a};if(replace)stack[stack.length-1]=r;else stack.push(r);render();window.scrollTo(0,0)}
function tab(p){stack=[{p}];render();window.scrollTo(0,0)}
function back(){if(stack.length>1)stack.pop();else stack=[{p:'home'}];cur().editing=false;render()}
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;if(cur().editing||!$('#sheet').hidden||!$('#modal').hidden){refreshLists();return}render()})}
function refreshLists(){$('#dls').innerHTML=`<datalist id="dl-contacts">${S.contacts.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><datalist id="dl-products">${S.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>`}
function render(){
  const r=cur();refreshLists();
  $('#main').innerHTML=ready?(VIEWS[r.p]||VIEWS.home)(r):`<div class="empty" style="padding-top:30vh">${ic('snow',40)}<b>กำลังโหลดข้อมูลร้าน…</b></div>`;
  navs();
}
const ROOT=()=>stack[0].p;
function navs(){
  const root=ROOT(),r=cur();
  const b=[['home','หน้าหลัก','home'],['account','บัญชี','chart'],['pos','แคชเชียร์','pos'],['staff','พนักงาน','staff']];
  $('#bnav').hidden=['doc','exp','prod','contact','empEdit','set','leave','posPick','posCart','posPay','posCash','posQR','posQuick'].includes(r.p);
  $('#bnav').innerHTML=b.map(([k,l,i])=>`<button class="${root===k?'on':''}" data-a="tab" data-x="${k}">${ic(i,24)}<span>${l}</span></button>`).join('');
  const key=r.p==='docs'?'docs:'+r.t:r.p;
  const item=(k,l,i)=>{const on=(k===key)||(stack.length===1&&k===root);return`<button class="${on?'on':''}" data-a="nav" data-x="${k}">${ic(i,20)}${l}</button>`};
  const c=company();
  $('#side').innerHTML=`<div class="brand"><div class="logo sm">${ic('snow',22)}</div><b>${esc(c.name)}<small>ระบบจัดการร้าน</small></b></div>
  ${b.map(x=>item(...x)).join('')}${item('schedule','ตารางนัดงาน','cal')}${item('clean','รอบล้างแอร์','spark')}
  <div class="grp">เอกสารขาย</div>${item('docs:JOB','ใบงานช่าง','staff')}${item('docs:QT','ใบเสนอราคา','doc')}${item('docs:RS','ใบจองสินค้า','box')}${item('docs:SO','ใบสั่งซื้อ/ใบส่งของ','doc')}${item('docs:INV','ใบแจ้งหนี้/ใบกำกับภาษี','doc')}${item('docs:RE','ใบเสร็จรับเงิน','receipt')}${item('docs:CS','ขายเงินสด','receipt')}${item('docs:CN','ใบลดหนี้','doc')}${item('docs:DN','ใบเพิ่มหนี้','doc')}
  <div class="grp">ซื้อและค่าใช้จ่าย</div>${item('docs:RI','ใบรับสินค้า','doc')}${item('docs:PV','ใบสำคัญจ่าย','receipt')}${item('docs:RV','ใบสำคัญรับ','receipt')}${item('expenses','ค่าใช้จ่าย','receipt')}
  <div class="grp">ข้อมูล</div>${item('dashboard','แดชบอร์ด','bars')}${item('products','สต๊อกสินค้า','box')}${item('money','การเงิน / บัญชีธนาคาร','cash')}${item('stats','สถิติการขาย','chart')}${item('vat','รายงานภาษีซื้อ-ขาย','doc')}${item('war','ทะเบียนรับประกัน','book')}${item('contacts','สมุดรายชื่อ','book')}${item('reports','รายงาน','list')}${item('settings','ตั้งค่า','gear')}`;
}
function navTo(k){
  if(['home','account','pos','staff'].includes(k))return tab(k);
  if(k.startsWith('docs:')){stack=[{p:'account'},{p:'docs',t:k.slice(5)}];render();return window.scrollTo(0,0)}
  stack=[{p:'account'},{p:k}];render();window.scrollTo(0,0);
}

/* ================= chart ================= */
function niceTop(max){if(max<=0)return{top:100,step:20};const raw=max/5,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;const s=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;return{top:s*Math.ceil(max/s),step:s}}
function barChart(labels,series,stacked){
  const n=labels.length,L=58,B=58,T=10,colW=Math.max(22,Math.min(60,620/n)),W=L+colW*n+10,H=280,ph=H-B-T;
  const tot=labels.map((_,i)=>stacked?series.reduce((s,x)=>s+(x.v[i]||0),0):Math.max(...series.map(x=>x.v[i]||0)));
  const {top,step}=niceTop(Math.max(...tot,0));
  const y=v=>T+ph-(v/top)*ph;
  let g='';
  for(let v=0;v<=top+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString()+'k':v}</text>`}
  const every=n>16?3:1;let bars='';
  labels.forEach((lb,i)=>{const cx=L+colW*i+colW/2;
    if(stacked){let acc=0;const bw=Math.min(20,colW*.55);series.forEach(s=>{const v=s.v[i]||0;if(v>0){bars+=`<rect x="${cx-bw/2}" y="${y(acc+v)}" width="${bw}" height="${y(acc)-y(acc+v)}" fill="${s.c}" rx="2"><title>${lb}: ${s.n} ${fmt(v)}</title></rect>`}acc+=v})}
    else{const bw=Math.min(14,colW*.35);series.forEach((s,k)=>{const v=s.v[i]||0;if(v>0){const x=cx-(series.length*bw)/2+k*bw;bars+=`<rect x="${x}" y="${y(v)}" width="${bw-2}" height="${y(0)-y(v)}" fill="${s.c}" rx="2"><title>${lb}: ${s.n} ${fmt(v)}</title></rect>`}})}
    if(i%every===0)bars+=`<text transform="translate(${cx+4},${H-B+16}) rotate(-45)" text-anchor="end" font-size="12" fill="var(--ink)">${lb}</text>`});
  return`<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="${Math.max(W,300)}" height="${H}" role="img" aria-label="กราฟ">${g}<line x1="${L}" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>${bars}</svg></div>`;
}
function buckets(rg,off){const now=new Date(),out=[];
  if(rg==='year'){const yy=now.getFullYear()+off;for(let m=0;m<12;m++)out.push({l:TH_M[m]+' '+yy,a:ymd(new Date(yy,m,1)),b:ymd(new Date(yy,m+1,0))});return{title:String(yy),arrows:true,out}}
  if(rg==='month'){const d=new Date(now.getFullYear(),now.getMonth()+off,1),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();for(let i=1;i<=n;i++){const s=ymd(new Date(d.getFullYear(),d.getMonth(),i));out.push({l:i+' '+TH_M[d.getMonth()],a:s,b:s})}return{title:TH_M[d.getMonth()]+' '+d.getFullYear(),arrows:true,out}}
  const k=+rg;for(let i=k-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({l:TH_M[d.getMonth()]+' '+d.getFullYear(),a:ymd(d),b:ymd(new Date(d.getFullYear(),d.getMonth()+1,0))})}
  return{title:k+' เดือนล่าสุด',arrows:false,out}}

  <div class="ctot"><span>รวม (รวม VAT)</span><b>${fmt(tot)}</b></div><button class="btn block" data-a="checkout" ${cart.length?'':'disabled style="opacity:.5"'}>${ic('cash',20)} ชำระเงิน</button>${cart.length?`<button class="btn ghost block" style="margin-top:8px" data-a="cartClear">ล้างตะกร้า</button>`:''}`}
VIEWS.pos=r=>{
  r.cart=r.cart||[];const td=today(),todays=S.docs.filter(d=>d.type==='CS'&&d.date===td&&d.status!=='ยกเลิก'&&d.status!=='รอเก็บเงิน');let cash=0,bank=0;
  todays.forEach(d=>{const a=calc(d).total;if(d.payment&&d.payment.method==='bank')bank+=a;else cash+=a});
  const prods=S.products.slice().sort((a,b)=>(a.kind==='service'?0:1)-(b.kind==='service'?0:1)||a.name.localeCompare(b.name,'th'));
  return topBar({title:'แคชเชียร์',backBtn:false,actions:ib('docs','list','บิลขายเงินสดทั้งหมด','CS')})+`<div class="wrap">
  <div class="pos-stats"><div><span class="sub">ขายวันนี้</span><b>${todays.length} บิล</b></div><div><span class="sub">รับเงินสด</span><b>${fmt(cash)}</b></div><div><span class="sub">รับโอน</span><b>${fmt(bank)}</b></div></div>
  <div class="pos-grid"><div>${prods.length?`<input class="search" type="search" placeholder="ค้นหาสินค้าหรือบริการ" data-filter="#plist" aria-label="ค้นหาสินค้า"><div class="pcards" id="plist">${prods.map(p=>`<button class="pcard" data-a="cartAdd" data-x="${p.id}" data-s="${esc((p.name+' '+(p.code||'')+' '+(p.desc||'')).toLowerCase())}"><span class="pk">${KIND[p.kind]||''}${p.kind==='stock'?' • เหลือ '+stockOf(p.id):''}</span><span class="pn">${esc(p.name)}</span><span class="pp">${fmt(p.price)}</span></button>`).join('')}</div>`:emptyState('ยังไม่มีสินค้าให้ขาย','เพิ่มสินค้าหรือบริการก่อน','nav','products')}</div>
  <aside class="cart" id="cart">${cartHTML(r)}</aside></div></div>`;
};

  ${S.employees.length?`<p class="sub" style="margin:0 0 6px">สรุปเดือน${TH_M[new Date().getMonth()]} นับงานจากเอกสารขายที่ระบุผู้ขาย</p><div class="list">${S.employees.map(e=>{const m=empMonth(e);return`<button class="row av" data-a="openEmp" data-x="${e.id}"><span class="av-sq" style="border-radius:50%;background:var(--blue-soft);color:var(--blue)">${esc(e.name.trim().charAt(0))}</span><span class="t">${esc(e.name)}</span><span class="a" style="font-size:16px">${m.jobs.length} งาน</span><span class="m" style="grid-column:2">${e.type==='salary'?'ช่างประจำ เงินเดือน '+fmt(e.rate):'ช่างรายงาน งานละ '+fmt(e.rate)}</span><span class="m" style="text-align:right">จ่ายแล้ว ${fmt(m.paid)}</span></button>`}).join('')}</div>`
  :emptyState('ยังไม่มีรายชื่อพนักงาน','เพิ่มช่างประจำหรือช่างรายงาน','newEmp')}</div>`;

  <div class="card pad" style="margin-top:12px"><div class="sub">${EMPT[e.type]||''}${e.dept?' • แผนก'+esc(e.dept):''}${e.phone?' • โทร '+esc(e.phone):''}${e.idCard?' • บัตร ปชช. '+maskId(e.idCard):''}</div><div style="font-size:18px;margin-top:4px">ยอดที่ควรจ่ายเดือนนี้ <b class="blue">${fmt(due)}</b>${e.type==='daily'?` <span class="sub">(${wd} วันที่มีงาน × ${fmt(e.rate)} แก้จำนวนเงินได้ตอนบันทึกจ่าย)</span>`:e.type==='job'?` <span class="sub">(${m.jobs.length} งาน × ${fmt(e.rate)})</span>`:''}</div>
   <button class="btn block" style="margin-top:14px" data-a="payEmp" data-x="${e.id}" data-y="${due}">${ic('cash',18)} บันทึกจ่ายเงินพนักงาน</button></div>
  <h2 class="h2">งานเดือนนี้</h2>${m.jobs.length?`<div class="list">${m.jobs.map(docRow).join('')}</div>`:'<p class="muted">ยังไม่มีงานที่ระบุช่างคนนี้</p>'}
  <h2 class="h2">ประวัติการจ่าย</h2>${pays.length?`<div class="list">${pays.map(x=>`<button class="row" data-a="openExp" data-x="${x.id}"><span class="t">${esc(x.desc||x.category)}</span><span class="a pink">${fmt(ecalc(x).total)}</span><span class="m">${esc(x.no)} • ${dmy(x.date)}</span></button>`).join('')}</div>`:'<p class="muted">ยังไม่มีประวัติ</p>'}</div>`;

/* ---- reports ---- */
VIEWS.reports=r=>{
  const mo=r.mo||today().slice(0,7),rg=[mo+'-01',ymd(new Date(+mo.slice(0,4),+mo.slice(5,7),0))],m=metrics(rg);
  const sales=S.docs.filter(d=>DT[d.type]&&DT[d.type].income&&!DT[d.type].sign&&!DT[d.type].other&&d.status!=='ยกเลิก'&&inR(d.date,rg));
  const itemMap={};sales.forEach(d=>{const f=d.vatMode==='exc'?1.07:1;(d.items||[]).forEach(i=>{const k=i.name||'-';itemMap[k]=itemMap[k]||{q:0,v:0};itemMap[k].q+=+i.qty||0;itemMap[k].v+=(+i.qty||0)*(+i.price||0)*f})});
  const topItems=Object.entries(itemMap).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
  const catMap={};S.expenses.filter(e=>e.status!=='ยกเลิก'&&inR(e.date,rg)).forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+ecalc(e).total});
  S.docs.filter(d=>(d.type==='RI'||d.type==='PV')&&d.status!=='ยกเลิก'&&inR(d.date,rg)).forEach(d=>{const k=d.type==='PV'?(d.category||'อื่นๆ'):'ซื้อสินค้า (ใบรับสินค้า)';catMap[k]=(catMap[k]||0)+calc(d).total});
  const vatOut=sales.reduce((s,d)=>s+calc(d).vat,0)+S.docs.filter(d=>DT[d.type]&&DT[d.type].sign&&d.status==='อนุมัติแล้ว'&&inR(d.date,rg)).reduce((s,d)=>s+DT[d.type].sign*calc(d).vat,0),vatIn=S.expenses.filter(e=>e.status!=='ยกเลิก'&&inR(e.date,rg)).reduce((s,e)=>s+ecalc(e).vat,0)+S.docs.filter(d=>(d.type==='RI'||d.type==='PV')&&d.status!=='ยกเลิก'&&inR(d.date,rg)).reduce((s,d)=>s+calc(d).vat,0);
  const recv=S.docs.filter(d=>(d.type==='INV'||d.type==='CS')&&d.status==='รอเก็บเงิน').sort((a,b)=>a.date.localeCompare(b.date));
  const cashIn=sales.filter(d=>d.payment&&d.payment.method==='cash').reduce((s,d)=>s+(+d.payment.amount||0),0),bankIn=sales.filter(d=>d.payment&&d.payment.method==='bank').reduce((s,d)=>s+(+d.payment.amount||0),0);
  return topBar({title:'รายงาน',actions:ib('exportCsv','share','ส่งออกไฟล์ CSV')})+`<div class="wrap">
  <label style="display:flex;align-items:center;gap:10px;margin:4px 0 16px;font-weight:600">เดือน<input type="month" value="${mo}" data-a="setMonth" class="search" style="width:auto;margin:0"></label>
  <div class="rep">
   <section class="card pad"><h3>สรุปรายได้-ค่าใช้จ่าย</h3><table class="tbl"><tr><td>รายได้ (ตามเอกสารขาย)</td><td class="rt blue">${fmt(m.income)}</td></tr><tr><td>เก็บเงินแล้ว</td><td class="rt">${fmt(m.collected)}</td></tr><tr><td>ค่าใช้จ่ายทั้งหมด</td><td class="rt pink">${fmt(m.cost)}</td></tr><tr><td><b>กำไร/ขาดทุนเบื้องต้น</b></td><td class="rt"><b class="${m.net<0?'pink':''}">${fmt(m.net)}</b></td></tr></table></section>
   <section class="card pad"><h3>เงินเข้า และภาษี</h3><table class="tbl"><tr><td>รับเป็นเงินสด</td><td class="rt">${fmt(cashIn)}</td></tr><tr><td>รับโอน/ธนาคาร</td><td class="rt">${fmt(bankIn)}</td></tr><tr><td>ภาษีขาย</td><td class="rt">${fmt(vatOut)}</td></tr><tr><td>ภาษีซื้อ</td><td class="rt">${fmt(vatIn)}</td></tr><tr><td><b>ภาษีที่ต้องชำระโดยประมาณ</b></td><td class="rt"><b>${fmt(vatOut-vatIn)}</b></td></tr></table></section>
   <section class="card pad"><h3>สินค้า/บริการขายดี</h3>${topItems.length?`<div class="tscroll"><table class="tbl"><tr><th>รายการ</th><th class="rt">จำนวน</th><th class="rt">ยอดขาย</th></tr>${topItems.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="rt">${v.q}</td><td class="rt">${fmt(v.v)}</td></tr>`).join('')}</table></div>`:'<p class="muted">ยังไม่มียอดขายเดือนนี้</p>'}</section>
   <section class="card pad"><h3>ค่าใช้จ่ายตามหมวด</h3>${Object.keys(catMap).length?`<table class="tbl">${Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="rt pink">${fmt(v)}</td></tr>`).join('')}</table>`:'<p class="muted">ยังไม่มีค่าใช้จ่ายเดือนนี้</p>'}</section>
   <section class="card pad" style="grid-column:1/-1"><h3>ลูกหนี้ค้างรับทั้งหมด</h3>${recv.length?`<div class="tscroll"><table class="tbl"><tr><th>ลูกค้า</th><th>เลขที่</th><th>วันที่</th><th class="rt">ค้างมาแล้ว</th><th class="rt">ยอด</th></tr>${recv.map(d=>`<tr><td>${esc(d.contactName)}</td><td>${esc(d.no)}</td><td>${dmy(d.date)}</td><td class="rt">${Math.max(0,Math.round((new Date(today())-new Date(d.date))/864e5))} วัน</td><td class="rt">${fmt(calc(d).total)}</td></tr>`).join('')}</table></div>`:'<p class="muted">ไม่มียอดค้างรับ</p>'}</section>
  </div></div>`;
};

/* ================= printable paper ================= */
function paperHTML(d,asReceipt){
  const T=DT[d.type],c=calc(d),co=company(),ct=S.contacts.find(x=>x.name===d.contactName)||{};
  const title=asReceipt?'ใบเสร็จรับเงิน':(d.type==='CS'?'บิลเงินสด/ใบกำกับภาษีอย่างย่อ':T.name);
  const no=asReceipt?d.payment.receiptNo:d.no,date=asReceipt?d.payment.date:d.date;
  const tech=d.techId&&byId('employees',d.techId);
  return`<div class="paper"><div class="p-head"><div><div style="font-size:18px;font-weight:700;color:#34779F">${esc(co.name)}</div><div>${esc(co.address).replace(/\n/g,'<br>')}</div>${co.taxId?`<div>เลขประจำตัวผู้เสียภาษี ${esc(co.taxId)}</div>`:''}<div>${[co.phone&&'โทร '+esc(co.phone),esc(co.email)].filter(Boolean).join(' ')}</div></div>
  <div><h2>${title}</h2><div style="text-align:right">เลขที่ <b>${esc(no)}</b><br>วันที่ ${dmy(date)}${asReceipt?`<br>อ้างอิง ${esc(d.no)}`:''}</div></div></div>
  <div style="margin-top:14px"><b>${T.group==='buy'?'ผู้ขาย':'ลูกค้า'}</b> ${esc(d.contactName||'-')}${custTaxHTML(d,ct)}${ct.address?`<br>${esc(ct.address)}`:''}${ct.phone?`<br>โทร ${esc(ct.phone)}`:''}${tech&&!asReceipt?`<br>ผู้ขาย ${esc(tech.name)}`:''}</div>
  <table><tr><th style="width:36px">#</th><th>รายการ</th><th class="rt">จำนวน</th><th class="rt">ราคา/หน่วย</th><th class="rt">จำนวนเงิน</th></tr>
  ${(d.items||[]).map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.name)}${i.desc?`<br><span style="color:#777">${esc(i.desc)}</span>`:''}</td><td class="rt">${+i.qty||0} ${esc(i.unit||'')}</td><td class="rt">${fmt(i.price)}</td><td class="rt">${fmt((+i.qty||0)*(+i.price||0))}</td></tr>`).join('')}</table>
  <div class="p-sum"><table><tr><td>รวมเป็นเงิน</td><td class="rt">${fmt(c.sub)}</td></tr>${c.disc?`<tr><td>${discLbl(d)}</td><td class="rt">-${fmt(c.disc)}</td></tr>`:''}${d.vatMode!=='none'?`<tr><td>มูลค่าก่อนภาษี</td><td class="rt">${fmt(c.pre)}</td></tr><tr><td>ภาษีมูลค่าเพิ่ม 7%</td><td class="rt">${fmt(c.vat)}</td></tr>`:''}<tr class="g"><td>รวมทั้งสิ้น</td><td class="rt">${fmt(c.total)}</td></tr>${c.wht?`<tr><td>หัก ณ ที่จ่าย ${+d.whtPct}%</td><td class="rt">-${fmt(c.wht)}</td></tr><tr class="g"><td>ยอดชำระ</td><td class="rt">${fmt(c.pay)}</td></tr>`:''}${asReceipt||d.type==='CS'?`<tr><td>ชำระโดย</td><td class="rt">${PM[d.payment&&d.payment.method]||'เงินสด'}</td></tr>`:''}</table></div>
  ${d.terms&&!asReceipt?`<div style="margin-top:14px"><b>เงื่อนไข</b><br>${esc(d.terms).replace(/\n/g,'<br>')}</div>`:''}
  <div class="p-sign"><div>${T.group==='buy'?'ผู้รับสินค้า':asReceipt?'ผู้รับเงิน':'ผู้อนุมัติ'}</div><div>${T.group==='buy'?'ผู้ส่งสินค้า':asReceipt?'ผู้จ่ายเงิน':'ลูกค้า'}</div></div></div>`;
}
function showPaper(d,asReceipt){
  openModal(`<div class="modal" role="dialog" aria-modal="true"><div class="modal-bar"><b>${asReceipt?'ใบเสร็จ '+esc(d.payment.receiptNo):esc(d.no||'ตัวอย่างเอกสาร')}</b><div class="btns">${DL?`<button class="btn ghost" data-a="dlPaper" data-x="${asReceipt?1:0}">${ic('share',18)} บันทึก/แชร์</button>`:''}<button class="btn ghost" data-a="print">${ic('print',18)} พิมพ์</button><button class="btn" data-a="closeModal">ปิด</button></div></div><div class="paper-wrap">${paperHTML(d,asReceipt)}</div></div>`);

function findContact(name){return S.contacts.find(c=>c.name.trim()===String(name||'').trim())}
async function ensureContact(name,kind){if(!name||!name.trim())return'';let c=findContact(name);if(!c){c={id:uid(),name:name.trim(),kind,phone:'',taxId:'',address:''};await put('contacts',c)}return c.id}
function normDoc(d){d.items=d.items.filter(i=>String(i.name||'').trim()).map(i=>({...i,qty:+i.qty||0,price:+i.price||0}));d.discPct=+d.discPct||0;d.discAmt=+d.discAmt||0;d.whtPct=+d.whtPct||0;return d}
async function saveDoc(stay){
  const r=cur(),d=normDoc(clone(r.draft)),T=DT[d.type];
  if(!d.items.length){toast('เพิ่มอย่างน้อย 1 รายการก่อนบันทึก');return null}
  if(!d.contactName.trim()&&d.type!=='CS'){toast('กรอกชื่อ'+(T.group==='sale'?'ลูกค้า':'ผู้ขาย')+'ก่อนบันทึก');return null}
  if(!d.contactName.trim())d.contactName='ลูกค้าทั่วไป';
  const old=byId('docs',d.id);
  if(!d.no||(old&&old.date.slice(0,7)!==d.date.slice(0,7)&&!old.no))d.no=nextNo(d.type,d.date,S.docs.filter(x=>x.type===d.type).map(x=>x.no));
  d.contactId=await ensureContact(d.contactName,T.group==='sale'?'customer':'vendor');
  if(d.type==='CS'){if(d.status==='รอเก็บเงิน'){delete d.payment}else{d.status=d.status==='ยกเลิก'?'ยกเลิก':'เก็บเงินแล้ว';if(!(d.payment&&d.payment.manual))d.payment={date:d.date,method:d.payMethod||'cash',accountId:(defaultAcct(d.payMethod||'cash')||{}).id||'',amount:calc(d).pay,receiptNo:''}}}
  else if(!PAID.includes(d.status))d.payment=null;
  await put('docs',d);r.draft=d;toast('บันทึก'+(T.short||T.name)+'แล้ว');
  if(!stay){r.editing=false;back()}
  return d;
}

function periodR(kind,off){const n=new Date();off=off||0;
  if(kind==='day'){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+off),s=ymd(d);return{a:s,b:s,t:off===0?'วันนี้':off===-1?'เมื่อวาน':d.getDate()+' '+TH_M[d.getMonth()]+' '+d.getFullYear(),nav:1}}
  if(kind==='week'){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)+off*7),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);return{a:ymd(d),b:ymd(e),t:off===0?'สัปดาห์นี้':d.getDate()+' '+TH_M[d.getMonth()]+' - '+e.getDate()+' '+TH_M[e.getMonth()]+' '+e.getFullYear(),nav:1}}
  if(kind==='month'){const d=new Date(n.getFullYear(),n.getMonth()+off,1);return{a:ymd(d),b:ymd(new Date(d.getFullYear(),d.getMonth()+1,0)),t:TH_M[d.getMonth()]+' '+d.getFullYear(),nav:1}}
  if(kind==='year'){const y=n.getFullYear()+off;return{a:y+'-01-01',b:y+'-12-31',t:String(y),nav:1}}
  const k=+kind,d=new Date(n.getFullYear(),n.getMonth()-k+1,1);return{a:ymd(d),b:ymd(new Date(n.getFullYear(),n.getMonth()+1,0)),t:TH_M[d.getMonth()]+' - '+TH_M[n.getMonth()]+' '+n.getFullYear(),nav:0}}
function periodBar(r,kinds,def){const k=r.rg||def,p=periodR(k,r.off||0);
  return`<div class="chips">${kinds.map(([v,l])=>`<button class="chip sq ${k===v?'on':''}" data-a="setRg" data-x="${v}">${l}</button>`).join('')}</div>
  <div class="pnav">${p.nav?`<button data-a="off" data-x="-1" aria-label="ก่อนหน้า">${ic('left')}</button>`:'<span></span>'}<b>${p.t}</b>${p.nav?`<button data-a="off" data-x="1" aria-label="ถัดไป">${ic('right')}</button>`:'<span></span>'}</div>`}

function sortProds(l,s){l=l.slice();if(s==='pdesc')l.sort((a,b)=>(+b.price||0)-(+a.price||0));else if(s==='pasc')l.sort((a,b)=>(+a.price||0)-(+b.price||0));else if(s==='new')l.reverse();else l.sort((a,b)=>a.name.localeCompare(b.name,'th'));return l}

function fileToImg(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amt){const f=(t,v)=>t+String(v.length).padStart(2,'0')+v;let d=String(id).replace(/\D/g,''),tag='01';
  if(d.length===13)tag='02';else if(d.length>=15)tag='03';else d='0066'+d.replace(/^0/,'');
  let p=f('00','01')+f('01',amt?'12':'11')+f('29',f('00','A000000677010111')+f(tag,d))+f('53','764')+(amt?f('54',(+amt).toFixed(2)):'')+f('58','TH')+'6304';return p+crc16(p)}

  const k=r.k||'';let list=S.contacts.slice();if(k)list=list.filter(c=>c.kind===k||c.kind==='both');
  const groups={};list.forEach(c=>{const g=groupKey(c.name);(groups[g]=groups[g]||[]).push(c)});
  const keys=Object.keys(groups).sort((a,b)=>{const t=x=>x==='#'?2:/[A-Z]/.test(x)?0:1;return t(a)-t(b)||a.localeCompare(b,'th')});
  const due=c=>S.docs.filter(d=>d.contactName===c.name&&(d.type==='INV'||d.type==='CS')&&d.status==='รอเก็บเงิน').reduce((s,d)=>s+calc(d).total,0);
  return topBar({title:'สมุดรายชื่อ',actions:ib('focusSearch','search','ค้นหา')+ib('newContact','plus','เพิ่มรายชื่อ')})+`<div class="wrap narrow">
  <div class="chips" style="margin:4px 0 8px">${chip('k','','ทั้งหมด',k)}${chip('k','customer','ลูกค้า',k)}${chip('k','vendor','ผู้ขาย',k)}</div>
  <div class="legend"><span class="dotc cu"></span>ลูกค้า <span class="dotc ve"></span>ผู้ขาย <span class="dotc bo"></span>ทั้งสองแบบ</div>
  ${S.contacts.length?`<input class="search" id="qsearch" type="search" placeholder="ค้นหาชื่อ เบอร์โทร หรือเลขผู้เสียภาษี" data-filter="#list" aria-label="ค้นหา"><div id="list">${keys.map(g=>`<div class="ghead">${g}</div>${groups[g].sort((a,b)=>a.name.localeCompare(b.name,'th')).map(c=>{const dv=due(c);return`<button class="crow" data-a="openContact" data-x="${c.id}" data-s="${esc((c.name+' '+(c.phone||'')+' '+(c.taxId||'')+' '+(c.code||'')).toLowerCase())}"><span class="dotc ${c.kind==='vendor'?'ve':c.kind==='both'?'bo':'cu'}"></span><span class="cn">${esc(c.name)}</span><span class="cs">${esc([c.code,c.branch||(c.taxId?'สำนักงานใหญ่':''),c.phone].filter(Boolean).join(' / '))}</span><span class="cr">${dv?`<b class="blue">ค้างรับ ${fmt(dv)}</b>`:esc(c.person||'')}</span></button>`}).join('')}`).join('')}</div>`
  :emptyState('ยังไม่มีรายชื่อ','รายชื่อจะถูกเพิ่มอัตโนมัติเมื่อออกเอกสาร หรือกดที่นี่เพื่อเพิ่มเอง','newContact')}</div>`;
};

VIEWS.report=r=>{
  const k=r.k,vat=!!r.vat,p=periodR(r.rg||'month',r.off||0);
  let body='',hero='';
  const rank=(arr,unitL,heroL)=>{const tot=arr.reduce((s,x)=>s+x.v,0);arr.sort((a,b)=>b.v-a.v);
    hero=arr.length?`<div class="rhero">${ic(REP[k][1],64)}<b>${esc(arr[0].n)}</b><span>${heroL}</span></div>`:'';
    return`<div class="rhead"><span>${arr.length} ${unitL}</span><b>${fmt(tot)}</b></div>${arr.map((x,i)=>`<div class="rrow"><span class="rn">#${i+1}</span><span class="rt"><b>${esc(x.n)}</b><small>${x.sub}</small></span><span class="rv"><b>${fmt(x.v)}</b><small>${tot?(x.v/tot*100).toFixed(0):0}%</small></span></div>`).join('')}`};
  if(k==='exp'){const m={};const add=(cat,v)=>{m[cat]=m[cat]||{n:cat,v:0,c:0};m[cat].v+=v;m[cat].c++};
    S.expenses.filter(e=>e.status!=='ยกเลิก'&&inP(e.date,p)).forEach(e=>{const c=ecalc(e);add(e.category,vat?c.total:c.pre)});
    S.docs.filter(d=>(d.type==='RI'||d.type==='PV')&&d.status!=='ยกเลิก'&&inP(d.date,p)).forEach(d=>{const c=calc(d);add(d.type==='PV'?(d.category||'อื่นๆ'):'ซื้อสินค้า (ใบรับสินค้า)',vat?c.total:c.pre)});
    const arr=Object.values(m).map(x=>({...x,sub:x.c+' รายการ'}));body=arr.length?rank(arr,'หมวด','เป็นหมวดที่ใช้จ่ายมากที่สุด'):'';}
  else if(k==='sum'){const L=salesIn(p).sort((a,b)=>(b.date+b.no).localeCompare(a.date+a.no));const tv=L.reduce((s,d)=>s+(vat?calc(d).total:calc(d).pre),0),tx=L.reduce((s,d)=>s+calc(d).vat,0);
    hero=`<div class="stat2 plain"><div>มูลค่ารวม<b class="blue">${fmt(tv)}</b></div><div>ภาษีมูลค่าเพิ่ม<b>${fmt(tx)}</b></div></div>`;
    body=L.length?`<div class="rhead"><span>${L.length} เอกสาร</span><b>${fmt(tv)}</b></div><div class="list">${L.map(docRow).join('')}</div>`:'';}
  else{const m={};const add=(key,n,v,cnt)=>{m[key]=m[key]||{n,v:0,c:0,q:0};m[key].v+=v;m[key].q+=cnt;m[key].c++};
    salesIn(p).forEach(d=>{if(k==='prod')lineVals(d,vat).forEach(({i,v})=>add(i.name||'-',i.name||'-',v,+i.qty||0));else{const c=calc(d);if(k==='cust')add(d.contactName,d.contactName,vat?c.total:c.pre,1);else add(d.techId||(d.sellerName?'n:'+d.sellerName:'-'),d.techId?empName(d.techId):(d.sellerName||'ไม่ระบุผู้ขาย'),vat?c.total:c.pre,1)}});
    const arr=Object.values(m).map(x=>({...x,sub:k==='prod'?x.q+' หน่วย':x.c+' เอกสาร'}));
    body=arr.length?rank(arr,k==='prod'?'สินค้า':k==='cust'?'ลูกค้า':'พนักงาน',k==='prod'?'เป็นสินค้ามียอดขายสูงสุด':k==='cust'?'ลูกค้าที่มียอดสูงสุด':'เป็นพนักงานทำยอดได้สูงสุด'):'';}
  return topBar({title:k==='exp'?'รายงานค่าใช้จ่าย':'รายงานขาย'})+`<div class="wrap narrow">
  <button class="rtitle" data-a="repMenu">${REP[k][0]} ${ic('chev',22)}</button>
  ${periodBar(r,RK,'month')}
  ${body?hero:''}
  <div class="vatbar"><span>${k==='prod'?'สินค้า':k==='cust'?'ลูกค้า':k==='emp'?'พนักงาน':k==='exp'?'หมวด':'รายการ'}</span><label class="chk">ราคารวม VAT <input type="checkbox" data-a="toggleRepVat" ${vat?'checked':''}></label></div>
  ${body||`<div class="empty">${ic('folder',56)}<b>ยังไม่มีข้อมูลในช่วงนี้</b></div>`}</div>`;
};

async function finishSale(method,received){const P=POS.pending;if(!P){tab('pos');return}
  const d=newDocObj('CS');d.vatMode='inc';d.terms='';d.items=P.items.map(i=>({pid:i.pid||'',name:i.name,desc:i.desc||'',qty:i.qty,unit:i.unit||'',price:i.price}));
  d.contactName=(P.name||'').trim()||'ลูกค้าทั่วไป';d.techId=P.techId||'';d.status='เก็บเงินแล้ว';d.no=nextNo('CS',d.date,S.docs.filter(x=>x.type==='CS').map(x=>x.no));
  d.payment={date:d.date,method,accountId:(defaultAcct(method)||{}).id||'',amount:calc(d).total,receiptNo:'',received:received&&received>calc(d).total?received:null};
  if(d.contactName!=='ลูกค้าทั่วไป')d.contactId=await ensureContact(d.contactName,'customer');
  await put('docs',d);if(P.fromCart){POS.cart=[];POS.name='';POS.tech=''}POS.pending=null;stack=[{p:'pos'}];render();toast('ขายสำเร็จ '+d.no);showPaper(d,false)}
VIEWS.posReport=r=>{const p=periodR(r.rg||'day',r.off||0),L=S.docs.filter(d=>d.type==='CS'&&d.status!=='ยกเลิก'&&inP(d.date,p)),tot=L.reduce((s,d)=>s+calc(d).total,0);
  const bm={},bi={},bt={};L.forEach(d=>{const c=calc(d),m=d.payment?d.payment.method:'cash';bm[m]=(bm[m]||0)+c.total;lineVals(d,true).forEach(({i,v})=>{bi[i.name]=bi[i.name]||{v:0,q:0};bi[i.name].v+=v;bi[i.name].q+=+i.qty||0});if(d.techId)bt[d.techId]=(bt[d.techId]||0)+c.total});
  const top1=o=>Object.entries(o).sort((a,b)=>(b[1].v??b[1])-(a[1].v??a[1]))[0];
  const tm=top1(bm),ti=top1(bi),tt=top1(bt);const det=r.det;
  const detail=det==='m'?Object.entries(bm).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<tr><td>${PM[m]||m}</td><td class="rt">${fmt(v)}</td><td class="rt">${tot?(v/tot*100).toFixed(1):0}%</td></tr>`).join(''):det==='i'?Object.entries(bi).sort((a,b)=>b[1].v-a[1].v).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="rt">${x.q}</td><td class="rt">${fmt(x.v)}</td></tr>`).join(''):det==='t'?Object.entries(bt).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<tr><td>${esc(empName(id))}</td><td class="rt">${fmt(v)}</td><td class="rt">${tot?(v/tot*100).toFixed(1):0}%</td></tr>`).join(''):'';
  const card=(key,icn,title,val)=>`<div class="rcard"><span class="c solid">${ic(icn,26)}</span><b>${title}</b><span class="sub">${val}</span><button class="btn ghost" data-a="set" data-x="det" data-y="${det===key?'':key}">${det===key?'ซ่อน':'ดูเพิ่มเติม'}</button></div>`;
  return topBar({title:'รายงานแคชเชียร์'})+`<div class="wrap narrow"><h2 class="h2" style="margin-top:6px">สรุปยอดขาย</h2>${periodBar(r,[['day','วัน'],['week','สัปดาห์'],['month','เดือน'],['year','ปี']],'day')}
  <div class="card pad" style="text-align:center;margin-top:12px">${ic('pos',56)}<div class="blue" style="font-weight:600;margin-top:8px">ยอดขายรวม</div><div class="big">฿ ${fmt(tot)}</div><div>${L.length} ออเดอร์</div><button class="btn ghost" style="margin-top:12px" data-a="go" data-x="posHistory">ดูบิลทั้งหมด</button></div>
  <h2 class="h2">วิเคราะห์การขาย</h2><div class="rgrid">${card('m','cash','ช่องทางรับเงิน',tm?`${PM[tm[0]]||tm[0]} ${(tm[1]/tot*100).toFixed(0)}%`:'-')}${card('i','box','สินค้าขายดี',ti?esc(ti[0]):'-')}${card('t','trophy','พนักงานดีเด่น',tt?esc(empName(tt[0])):'ยังไม่ระบุผู้ขายในบิล')}</div>

function bahtText(n){n=r2(Math.abs(n));const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=s=>{let o='';s=String(s);if(s.length>6){o+=rd(s.slice(0,-6))+'ล้าน';s=s.slice(-6)}s=s.replace(/^0+/,'');const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;if(p===0&&d===1&&L>1)o+='เอ็ด';else if(p===1&&d===2)o+='ยี่';else if(!(p===1&&d===1))o+=D[d];o+=P[p]}return o};
  const [b,s]=n.toFixed(2).split('.');if(!+b&&!+s)return'ศูนย์บาทถ้วน';return(+b?rd(b)+'บาท':'')+(+s?rd(s)+'สตางค์':'ถ้วน')}

function addDays(s,n){const d=new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)+(+n||0));return ymd(d)}
const dueOf=d=>(+d.creditDays>0)?addDays(d.date,d.creditDays):'';
function fileToPng(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
  const px=g.getImageData(0,0,c.width,c.height),a=px.data;for(let i=0;i<a.length;i+=4){const m=Math.min(a[i],a[i+1],a[i+2]);if(m>228){a[i+3]=Math.round(a[i+3]*Math.max(0,(250-m)/22))}}g.putImageData(px,0,0);res(c.toDataURL('image/png'))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
const dataUrlToBlob=u=>{const [h,b]=u.split(','),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.slice(5,h.indexOf(';'))})};

    await sbStart()},
  sbSignUp:async()=>{const [e,p]=_getCred();if(!e||p.length<8)return toast('กรอกอีเมล และรหัสผ่านอย่างน้อย 8 ตัว');
    const {data,error}=await SB.auth.signUp({email:e,password:p});if(error)return toast('สมัครไม่สำเร็จ: '+error.message);
    if(!data.session){UI.login={email:e};toast('ส่งอีเมลยืนยันแล้ว กดลิงก์ในอีเมลก่อน แล้วกลับมาเข้าสู่ระบบ');return render()}
    await sbStart()},
  sbForgot:async()=>{const [e]=_getCred();if(!e)return toast('กรอกอีเมลก่อน');
    const {error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});toast(error?'ส่งไม่สำเร็จ':'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมลแล้ว')},
  sbRecheck:async()=>{await sbStart()},
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&/^lg(Email|Pass)$/.test(e.target.id)){const b=document.querySelector('.login-card [data-a="sbLogin"],.login-card [data-a="sbSignUp"]');if(b)b.click()}});

/* ---- โหลดข้อมูล + เรียลไทม์ ---- */
function sbSetRows(rows){const by={};TABLE_COLS.forEach(c=>by[c]=[]);rows.forEach(r=>{if(by[r.col])by[r.col].push(Object.assign({},r.data,{id:r.id}))});TABLE_COLS.forEach(c=>S[c]=by[c])}
async function sbFetchAll(){const out=[];for(let from=0;;from+=1000){const {data,error}=await DB.from('records').select('col,id,data').eq('org_id',ORG).order('col').order('id').range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function sbReloadAll(){try{sbSetRows(await sbFetchAll());await sbMembers();scheduleRender()}catch(e){console.warn(e)}}
async function sbMembers(){const {data}=await DB.from('members').select('user_id,email,name,role,disabled').order('created_at');S.users=(data||[]).map(m=>({id:m.user_id,email:m.email,name:m.name||m.email||'',role:m.role,disabled:m.disabled}))}
let _chan=null;
function sbSubscribe(){if(_chan)DB.removeChannel(_chan);
  _chan=DB.channel('records-'+ORG).on('postgres_changes',{event:'*',schema:'public',table:'records',filter:'org_id=eq.'+ORG},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.col&&S[o.col]&&o.id)S[o.col]=S[o.col].filter(x=>x.id!==o.id)}
    else{const n=p.new;if(!n||!S[n.col])return;const rec=Object.assign({},n.data,{id:n.id}),i=S[n.col].findIndex(x=>x.id===n.id);if(i>=0)S[n.col][i]=rec;else S[n.col].push(rec)}
    scheduleRender()}).subscribe()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DB&&ME)sbReloadAll()});

async function sbStart(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){ME=null;DB=null;mode='local';BOOTING=false;ready=true;return render()}
  const uidv=session.user.id;
  const {data:me,error}=await SB.from('members').select('user_id,org_id,email,name,role,disabled').eq('user_id',uidv).maybeSingle();
  if(error||!me){UI.login={waiting:session.user.email||''};ME=null;BOOTING=false;ready=true;return render()}
  if(me.disabled){UI.login={off:1};ME=null;BOOTING=false;ready=true;return render()}
  if(me.role!=='owner'&&me.role!=='admin'){UI.login={waiting:me.email||session.user.email||''};ME=null;BOOTING=false;ready=true;return render()}
  DB=SB;ORG=me.org_id;mode='db';
  try{sbSetRows(await sbFetchAll());await sbMembers()}catch(e){console.warn(e);toast('โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า')}
  ME={id:uidv,name:me.name||me.email||'',role:me.role,email:me.email};
  SESSION={uid:uidv,exp:0};touchSession();UI.login={};stack=[{p:'home'}];BOOTING=false;ready=true;sbSubscribe();render();toast('สวัสดี '+ME.name)}

/* ---- หน้า "ผู้ใช้และสิทธิ์" (สมาชิกจริงจาก Supabase) ---- */
const ROLE_TH={owner:'เจ้าของร้าน',admin:'แอดมิน',pending:'รออนุมัติ'};
VIEWS.users=r=>{const P=adminPerms();return topBar({title:'ผู้ใช้และสิทธิ์'})+`<div class="wrap narrow">
  <p class="sub" style="margin-top:0">คนใหม่สมัครผ่านหน้าล็อกอิน แล้วจะขึ้นเป็น "รออนุมัติ" กดอนุมัติเป็นแอดมินที่นี่</p>
  <div class="list">${S.users.map(u=>`<div class="row"><span class="t">${esc(u.name)}${u.disabled?' <span class="badge">ปิดใช้</span>':''}<small class="muted" style="display:block;font-weight:500">${esc(u.email||'')}</small></span><span class="a" style="font-size:15px">${ROLE_TH[u.role]||u.role}</span><span class="m">${u.role==='pending'?`<button class="lnk" data-a="memRole" data-x="${u.id}" data-y="admin">อนุมัติเป็นแอดมิน</button> • `:''}<button class="lnk" data-a="memName" data-x="${u.id}">เปลี่ยนชื่อ</button>${u.id!==ME.id?` • <button class="lnk" data-a="memRole" data-x="${u.id}" data-y="${u.role==='owner'?'admin':'owner'}">${u.role==='owner'?'ลดเป็นแอดมิน':'ตั้งเป็นเจ้าของ'}</button> • <button class="lnk" data-a="memToggle" data-x="${u.id}">${u.disabled?'เปิดใช้':'ปิดใช้'}</button>`:''}</span></div>`).join('')||'<div class="empty">ยังไม่มีสมาชิก</div>'}</div>
  <h2 class="h2">สิทธิ์ของแอดมิน</h2><p class="sub" style="margin-top:0">แอดมินทำได้เสมอ: ออกเอกสารขาย ใบงาน แคชเชียร์ ลูกค้า สินค้า สต็อก นัดงาน ใบลา ติ๊กเพื่ออนุญาตเพิ่ม</p>
  <div class="card pad" style="display:grid;gap:10px">${PERMS.map(([k,l])=>`<label class="chk" style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-a="permToggle" data-x="${k}" ${P[k]?'checked':''}> ${l}</label>`).join('')}</div>
  <h2 class="h2">ออกจากระบบอัตโนมัติ</h2><div class="chips">${[5,15,30,60,240].map(v=>`<button class="chip ${idleMin()===v?'on':''}" data-a="idleSet" data-x="${v}">${v<60?v+' นาที':v/60+' ชม.'}</button>`).join('')}</div>
  <div class="note">ระบบฐานข้อมูลบังคับสิทธิ์จริงสำหรับ: บัญชีเงิน/โอนเงิน, ค่าใช้จ่าย, ใบสำคัญจ่าย/ใบรับสินค้า/ใบสั่งซื้อ (สิทธิ์ "ค่าใช้จ่าย"), ใบสำคัญรับ (สิทธิ์ "ยอดเงิน") และการแก้ตั้งค่าบริษัท ส่วนเงินเดือน/ต้นทุนสินค้า/รายงาน ยังเป็นการซ่อนหน้าจอเท่านั้น</div></div>`};
Object.assign(A,{
  memRole:async(x,y)=>{const u=S.users.find(m=>m.id===x);if(!u)return;if(y==='owner'&&!await askConfirm('ตั้ง '+u.name+' เป็นเจ้าของร้าน? จะเข้าถึงได้ทุกส่วน'))return;
    const {error}=await DB.from('members').update({role:y}).eq('user_id',x);toast(error?(error.message||'ทำไม่สำเร็จ'):'บันทึกแล้ว');await sbMembers();render()},
  memToggle:async x=>{const u=S.users.find(m=>m.id===x);if(!u)return;const {error}=await DB.from('members').update({disabled:!u.disabled}).eq('user_id',x);toast(error?(error.message||'ทำไม่สำเร็จ'):'บันทึกแล้ว');await sbMembers();render()},
  memName:x=>{const u=S.users.find(m=>m.id===x);openSheet(`<h3>เปลี่ยนชื่อที่แสดง</h3><div class="form"><label>ชื่อ<input id="mnName" value="${esc(u?u.name:'')}"></label><button class="btn block" data-a="memNameSave" data-x="${x}">บันทึก</button></div>`)},
  memNameSave:async x=>{const n=($('#mnName').value||'').trim();if(!n)return toast('กรอกชื่อ');const {error}=await DB.from('members').update({name:n}).eq('user_id',x);closeSheet();toast(error?'ไม่สำเร็จ':'บันทึกแล้ว');await sbMembers();if(ME&&x===ME.id)ME.name=n;render()},
});

/* ---- นำเข้าข้อมูลเดิม (ครั้งเดียว/ตอนสลับใช้งาน) ---- */
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':(v&&typeof v==='object')?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
let MIG=null;
VIEWS.migrate=r=>topBar({title:'นำเข้าข้อมูลจากแอปเดิม'})+`<div class="wrap narrow">
  <p class="sub" style="margin-top:0">เลือกไฟล์สำรองข้อมูลของแอปเดิม (.json) ระบบจะนำเข้าทุกหมวดแล้วตรวจเทียบทีละรายการว่าตรงกับไฟล์ หมวดผู้ใช้/PIN เดิมจะไม่ถูกนำเข้า (ใช้ล็อกอินอีเมลแทน)</p>
  <label class="btn block" style="cursor:pointer">${ic('share',18)} เลือกไฟล์สำรอง (.json)<input type="file" accept=".json,application/json" id="migFile" hidden></label>
  ${MIG?`<div class="card pad" style="display:grid;gap:8px;margin-top:10px"><b class="blue">ไฟล์: ${esc(MIG.name)} (${MIG.total} รายการ)</b>
   <div class="tscroll"><table class="tbl"><tr><th>หมวด</th><th class="rt">ในไฟล์</th><th class="rt">ในระบบ</th><th>ผลตรวจ</th></tr>${TABLE_COLS.map(c=>{const f=(MIG.data[c]||[]).length,d=(S[c]||[]).length,ok=MIG.res&&MIG.res[c];return`<tr><td>${c}</td><td class="rt">${f}</td><td class="rt">${d}</td><td>${ok===undefined?'-':ok===true?'✅ ตรงทุกรายการ':'⚠ '+esc(ok)}</td></tr>`}).join('')}</table></div>
   <label class="chk" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="migWipe"> ล้างข้อมูลในระบบก่อนนำเข้า (ใช้ตอนสลับใช้งานจริง เพื่อให้ตรงกับไฟล์เป๊ะ)</label>
   <button class="btn block" data-a="migRun">นำเข้าข้อมูล</button><button class="btn ghost block" data-a="migVerify">ตรวจเทียบกับไฟล์</button></div>`:''}
  </div>`;
document.addEventListener('change',async e=>{if(e.target.id!=='migFile'||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';
  try{const j=JSON.parse(await f.text()),data=j&&j.data?j.data:j;if(!data||typeof data!=='object')throw 0;const D={};let total=0;TABLE_COLS.forEach(c=>{D[c]=Array.isArray(data[c])?data[c].filter(x=>x&&x.id):[];total+=D[c].length});MIG={name:f.name,data:D,total,res:null};render()}catch(x){toast('อ่านไฟล์ไม่ได้')}});
Object.assign(A,{
  migVerify:async()=>{if(!MIG)return;toast('กำลังตรวจ…');await sbReloadAll();const res={};
    TABLE_COLS.forEach(c=>{const file=MIG.data[c]||[],db=new Map((S[c]||[]).map(x=>[x.id,x]));let miss=0,diff=0;file.forEach(x=>{const y=db.get(x.id);if(!y)miss++;else if(canon(y)!==canon(x))diff++});const extra=(S[c]||[]).length-file.length+miss;
      res[c]=(!miss&&!diff&&extra<=0)?true:`ขาด ${miss}, ต่าง ${diff}, เกิน ${Math.max(extra,0)}`});
    MIG.res=res;render();toast(Object.values(res).every(v=>v===true)?'ตรงทุกรายการ ✅':'พบความต่าง ดูตาราง')},
  migRun:async()=>{if(!MIG)return;const wipe=$('#migWipe')&&$('#migWipe').checked;
    if(wipe&&!await askConfirm('จะลบข้อมูลทั้งหมดในระบบแล้วนำเข้าตามไฟล์ ยืนยัน?',{ok:'ล้างแล้วนำเข้า'}))return;
    if(!wipe&&!await askConfirm('นำเข้า '+MIG.total+' รายการ (รายการที่เลขเดียวกันจะถูกแทนที่ด้วยข้อมูลในไฟล์)',{ok:'นำเข้า',danger:false}))return;
    toast('กำลังนำเข้า… อย่าปิดหน้านี้');
    if(wipe){const {error}=await DB.from('records').delete().eq('org_id',ORG).in('col',TABLE_COLS);if(error)return toast('ล้างไม่สำเร็จ: '+error.message)}
    const rows=[];TABLE_COLS.forEach(c=>MIG.data[c].forEach(x=>{const {id,...body}=x;rows.push({org_id:ORG,col:c,id,data:body})}));
    for(let i=0;i<rows.length;i+=100){const {error}=await DB.from('records').upsert(rows.slice(i,i+100),{onConflict:'org_id,col,id'});if(error){console.warn(error);return toast('นำเข้าไม่สำเร็จที่รายการ '+i+': '+error.message)}}
    toast('นำเข้าครบ '+rows.length+' รายการ กำลังตรวจเทียบ…');await A.migVerify()},
});
const _vsetM=VIEWS.settings;VIEWS.settings=r=>{let h=_vsetM(r);if(isOwner())h=h.replace('<div class="slist">',`<div class="slist"><button class="srow" data-a="go" data-x="migrate"><span>นำเข้าข้อมูลจากแอปเดิม<small>เลือกไฟล์สำรอง แล้วตรวจเทียบทีละรายการ</small></span>${ic('right')}</button>`);return h};

/* ---- เริ่มทำงาน ---- */
render();
(async()=>{
  if(!CFG_OK){BOOTING=false;ready=true;return render()}
  SB=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  try{await sbStart()}catch(e){console.warn(e);BOOTING=false;ready=true;render()}
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ME){ME=null;SESSION=null;DB=null;mode='local';render()}});
})();

</script>
